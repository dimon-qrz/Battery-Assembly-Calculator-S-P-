<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Battery Master Calculator</title>
    <style>
        :root {
            --primary: #58a6ff;
            --bg: #0d1117;
            --surface: #161b22;
            --text: #e6edf3;
            --border: #30363d;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .card {
            background: var(--surface);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { font-size: 24px; margin-bottom: 25px; text-align: center; color: var(--primary); }

        .group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .radio-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .radio-opt { 
            background: #010409; padding: 10px; border: 1px solid var(--border); 
            border-radius: 8px; text-align: center; cursor: pointer; font-size: 13px;
        }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-opt { border-color: var(--primary); background: #1f2937; color: var(--primary); }

        input[type="number"] { 
            width: 100%; padding: 12px; background: #010409; border: 1px solid var(--border); 
            border-radius: 8px; color: white; box-sizing: border-box; font-size: 16px; 
        }

        .result-panel { 
            background: linear-gradient(145deg, #1c2128, #161b22);
            padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-top: 25px;
        }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .res-val { color: var(--primary); font-weight: bold; }

        .viz-box { 
            margin-top: 20px; padding: 20px; background: #010409; 
            border-radius: 8px; display: flex; justify-content: center; overflow-x: auto;
        }
        .cell { width: 30px; height: 50px; background: #21262d; border: 2px solid var(--primary); border-radius: 4px; margin: 2px; }

        footer { margin-top: 30px; font-size: 12px; text-align: center; color: #586067; }
        footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>Battery Calculator</h1>

    <div class="group">
        <label>Тип акумулятора:</label>
        <div class="radio-grid">
            <label><input type="radio" name="chem" value="liion" checked onchange="calc()"> <div class="radio-opt">Li-ion</div></label>
            <label><input type="radio" name="chem" value="lifepo4" onchange="calc()"> <div class="radio-opt">LiFePO4</div></label>
            <label><input type="radio" name="chem" value="lead" onchange="calc()"> <div class="radio-opt">12V Lead</div></label>
        </div>
    </div>

    <div class="group">
        <label>Кількість S (послідовно):</label>
        <input type="number" id="s" value="4" min="1" oninput="calc()">
    </div>
    <div class="group">
        <label>Кількість P (паралельно):</label>
        <input type="number" id="p" value="1" min="1" oninput="calc()">
    </div>

    <div class="result-panel">
        <div class="res-row"><span>Напруга:</span> <span id="v" class="res-val">12.8 V</span></div>
        <div class="res-row"><span>Всього елементів:</span> <span id="total" class="res-val">4</span></div>
    </div>

    <div class="viz-box" id="viz"></div>

    <footer>
        Dima Lasun | <a href="https://github.com/dimon-qrz">GitHub</a> | <a href="https://www.facebook.com/groups/3145673675685047">Група FB</a>
    </footer>
</div>

<script>
    function calc() {
        const chem = document.querySelector('input[name="chem"]:checked').value;
        const s = parseInt(document.getElementById('s').value) || 1;
        const p = parseInt(document.getElementById('p').value) || 1;
        
        // Визначаємо номінал
        const rates = { liion: 3.6, lifepo4: 3.2, lead: 12.0 };
        const voltage = (s * rates[chem]).toFixed(1);
        
        document.getElementById('v').innerText = voltage + " V";
        document.getElementById('total').innerText = (s * p);
        
        // Візуалізація
        const viz = document.getElementById('viz');
        viz.innerHTML = '';
        const limit = Math.min(s * p, 20);
        for(let i=0; i<limit; i++) {
            let div = document.createElement('div');
            div.className = 'cell';
            viz.appendChild(div);
        }
    }
    calc();
</script>
</body>
</html>
